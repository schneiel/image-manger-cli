[package]
name = "image-manager-cli"
version = "0.1.0"
edition = "2021"
authors = ["Elias Schneider <31616053+schneiel@users.noreply.github.com>"]
description = "A CLI tool for image organization and duplicate detection"
license = "MIT"

[[bin]]
name = "image-manager-cli"
path = "src/main.rs"

[dependencies]
filesort = { git = "https://github.com/schneiel/filesort" }
imgdedup = { git = "https://github.com/schneiel/imgdedup" }
clap = { version = "4.4", features = ["derive", "color"] }
indicatif = "0.17"
console = "0.15"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
image = "0.24"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"